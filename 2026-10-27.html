<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 日报</title>
<style>
:root{--line:#eceff4;--ink:#101828;--sub:#667085;--brand:#1d4ed8;--chip:#eff6ff}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#fff;color:var(--ink);font-size:13px;
  font-family:"Microsoft YaHei UI","Segoe UI",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
header{flex:none;display:flex;justify-content:space-between;align-items:center;padding:14px 15px 9px}
.brand{display:flex;align-items:center;gap:8px}
.dot{width:7px;height:7px;border-radius:50%;flex:none;
  background:linear-gradient(135deg,#2563eb,#8b5cf6)}
h1{font-size:13.5px;margin:0;font-weight:600;letter-spacing:.3px}
.date{font-size:11px;color:#a3a9b5;margin-left:2px}
#close{background:none;border:0;font-size:13px;line-height:1;color:#b4bac6;
  cursor:pointer;padding:5px 7px;border-radius:7px;transition:all .15s}
#close:hover{background:#f2f4f7;color:#475467}

nav{flex:none;padding:0 14px 10px}
.seg{display:flex;background:#f2f4f7;border-radius:10px;padding:3px;gap:2px}
.tab{flex:1;text-align:center;font-size:12px;color:#667085;padding:6px 0;
  border-radius:8px;cursor:pointer;user-select:none;transition:all .15s}
.tab:hover{color:#344054}
.tab.active{background:#fff;color:var(--brand);font-weight:600;
  box-shadow:0 1px 2px rgba(16,24,40,.08)}

main{flex:1 1 auto;min-height:0;padding:2px 12px 8px;overflow-y:auto;scrollbar-width:thin}
main::-webkit-scrollbar{width:6px}
main::-webkit-scrollbar-thumb{background:#e4e7ec;border-radius:3px}
.card{border:1px solid var(--line);border-radius:9px;padding:9px 10px;margin-bottom:7px}
.card:hover{border-color:#dde2ea}
.chip{display:inline-block;background:var(--chip);color:var(--brand);font-size:10px;
  padding:1px 5px;border-radius:4px;margin-right:6px;position:relative;top:-1px}
.t{font-weight:600;font-size:13px;line-height:1.42;display:inline}
.meta{margin-top:4px;font-size:10px;color:#a3a9b5}
.meta a{color:#2563eb;text-decoration:none}
.meta a:hover{text-decoration:underline}
details{margin-top:5px}
summary{list-style:none;cursor:pointer;font-size:11px;color:#0f766e;
  font-weight:600;padding:2px 0;user-select:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"▸";display:inline-block;width:12px;transition:transform .15s}
details[open] summary::before{transform:rotate(90deg)}
.k{font-size:11px;font-weight:600;color:#0f766e;margin:9px 0 2px}
.v{font-size:11.5px;color:#344054;line-height:1.6}

footer{flex:none;padding:9px 16px 11px;border-top:1px solid #f2f4f7}
.action{font-size:12px;line-height:1.55;color:#344054}
.hint{font-size:10.5px;color:#b4bac6;margin-top:5px}
</style>
</head>
<body>
<header>
  <div class="brand">
    <span class="dot"></span>
    <h1>AI 日报</h1>
    <span class="date" id="date"></span>
  </div>
  <button id="close" title="关闭 (Esc)">✕</button>
</header>
<nav><div class="seg" id="tabs"></div></nav>
<main id="pane"></main>
<footer>
  <div class="action" id="action"></div>
  <div class="hint">点标题展开解读 · 点「原文」跳转 · Esc 关闭</div>
</footer>

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

$('#date').textContent = DATA.date || '';
$('#action').textContent = DATA.action ? '👉 ' + DATA.action : '';

// 去掉 “A 区 · / B 区 ·” 前缀，只留标题
const cleanName = (n) => n.replace(/^[A-Za-z]\s*区\s*·\s*/, '');

const tabs = $('#tabs');
const pane = $('#pane');

function renderSection(i) {
  const sec = DATA.sections[i];
  pane.innerHTML = sec.items.map((it) => `
    <div class="card">
      ${it.tag ? `<span class="chip">${esc(it.tag)}</span>` : ''}
      <span class="t">${esc(it.title)}</span>
      <div class="meta">
        ${esc(it.source)} · ${esc(it.date)}
        ${it.url ? ` <a href="${esc(it.url)}" target="_blank" rel="noreferrer">原文 ↗</a>` : ''}
      </div>
      <details>
        <summary>结构化整理</summary>
        ${(it.details || []).map((d) => `
          <div class="k">${esc(d.k)}</div>
          <div class="v">${esc(d.v)}</div>`).join('')}
        ${it.url ? `<div class="k"><a href="${esc(it.url)}" target="_blank" rel="noreferrer">打开原文阅读 →</a></div>` : ''}
      </details>
    </div>`).join('');
  [...tabs.children].forEach((el, j) => el.classList.toggle('active', i === j));
  pane.scrollTop = 0;
}

(DATA.sections || []).forEach((sec, i) => {
  const el = document.createElement('div');
  el.className = 'tab';
  el.textContent = cleanName(sec.name);
  el.onclick = () => renderSection(i);
  tabs.appendChild(el);
});
if (DATA.sections && DATA.sections.length) renderSection(0);

function shut() {
  window.open('', '_self');
  window.close();
  setTimeout(shut, 200);
}
$('#close').onclick = shut;
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') shut();
  if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
    const cur = [...tabs.children].findIndex(x => x.classList.contains('active'));
    const next = e.key === 'ArrowRight' ? cur + 1 : cur - 1;
    if (next >= 0 && next < tabs.children.length) renderSection(next);
  }
});
</script>
</body>
</html>
