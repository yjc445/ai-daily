// 补发标记：不在 12:25~12:45 之间生成的，标出实际生成时间
if (GENERATED && GENERATED.time) {
  const hh = parseInt(GENERATED.time.slice(0, 2), 10);
  const mm = parseInt(GENERATED.time.slice(3, 5), 10);
  const onTime = (hh === 12 && mm >= 25 && mm <= 45);
  if (!onTime) {
    var el = $('#late');
    el.style.display = '';
    el.textContent = '补发 ' + GENERATED.time;
  }
}

$('#action').textContent = DATA.action ? '👉 ' + DATA.action : '';

const cleanName = (n) => n.replace(/^[A-Za-z]\s*区\s*·\s*/, '');
const tabs = $('#tabs');
const pane = $('#pane');

function renderSection(i) {
  const sec = DATA.sections[i];
  pane.innerHTML = (sec.items || []).map((it) => `
    <div class="card">
      ${it.tag ? `<span class="chip">${esc(it.tag)}</span>` : ''}
      <span class="t">${esc(it.title)}</span>
      ${it.summary ? `<div class="sum">${esc(it.summary)}</div>` : ''}
      <div class="meta">
        ${esc(it.source)} · ${esc(it.date)}
        ${it.url ? ` <a href="${esc(it.url)}" target="_blank" rel="noreferrer">原文 ↗</a>` : ''}
      </div>
      <details>
        <summary>结构化整理</summary>
        ${(it.details || []).map((d) => `
          <div class="k">${esc(d.k)}</div>
          <div class="v">${esc(d.v)}</div>`).join('')}
        ${it.url ? `<div class="k"><a href="${esc(it.url)}" target="_blank" rel="noreferrer">打开原文阅读 →</a></div>` : ''}
      </details>
    </div>`).join('');
  [...tabs.children].forEach((el, j) => el.classList.toggle('active', i === j));
  pane.scrollTop = 0;
}

(DATA.sections || []).forEach((sec, i) => {
  const el = document.createElement('div');
  el.className = 'tab';
  el.textContent = cleanName(sec.name);
  el.onclick = () => renderSection(i);
  tabs.appendChild(el);
});
if (DATA.sections && DATA.sections.length) renderSection(0);

function shut() {
  window.open('', '_self');
  window.close();
  setTimeout(shut, 200);
}
$('#close').onclick = shut;
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') shut();
  if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
    const cur = [...tabs.children].findIndex(x => x.classList.contains('active'));
    const next = e.key === 'ArrowRight' ? cur + 1 : cur - 1;
    if (next >= 0 && next < tabs.children.length) renderSection(next);
  }
});
</script>
</body>
</html>
